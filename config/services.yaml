services:
    _defaults:
        public: false
        autowire: true
        autoconfigure: true

    #
    # CONTROLLERS
    #

    # auto-register all controllers as services
    OpenDxp\Bundle\NewsletterBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

    #
    # INSTALLER
    #
    OpenDxp\Bundle\NewsletterBundle\Installer:
        public: true
        arguments:
            $bundle: "@=service('kernel').getBundle('OpenDxpNewsletterBundle')"

    #
    # TWIG TEMPLATING
    #
    OpenDxp\Bundle\NewsletterBundle\Twig\Extension\DocumentHelperExtensions:
        tags: [ 'twig.extension' ]

    #
    # NEWSLETTER ADAPTERS
    #
    opendxp_newsletter.document.newsletter.factory.default:
        class: OpenDxp\Bundle\NewsletterBundle\Document\Newsletter\DefaultAddressSourceAdapterFactory
        arguments:
            - 'OpenDxp\Bundle\NewsletterBundle\Document\Newsletter\AddressSourceAdapter\DefaultAdapter'


    opendxp_newsletter.document.newsletter.factory.csv:
        class: OpenDxp\Bundle\NewsletterBundle\Document\Newsletter\DefaultAddressSourceAdapterFactory
        arguments:
            - 'OpenDxp\Bundle\NewsletterBundle\Document\Newsletter\AddressSourceAdapter\CsvList'


    opendxp_newsletter.address_source_adapter.factories:
        class: Symfony\Component\DependencyInjection\ServiceLocator
        public: true
        tags: ['container.service_locator']
        arguments: [[]]
