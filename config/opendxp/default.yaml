opendxp_newsletter:
    source_adapters:
        defaultAdapter: opendxp_newsletter.document.newsletter.factory.default
        csvList: opendxp_newsletter.document.newsletter.factory.csv
#    default_url_prefix: 'https://my-host.com' # default prefix for your static assets
#    use_specific: false # set true to use the following options for newsletter delivery
#    sender:
#        name: ''
#        email: ''
#    return:
#        name: ''
#        email: ''

framework:
    mailer:
        enabled: true
        transports:
            opendxp_newsletter: native://default
    messenger:
        routing:
            'OpenDxp\Bundle\NewsletterBundle\Messenger\SendNewsletterMessage': opendxp_core

opendxp:
    objects:
        class_definitions:
            data:
                map:
                    newsletterActive: \OpenDxp\Bundle\NewsletterBundle\Model\DataObject\ClassDefinition\Data\NewsletterActive
                    newsletterConfirmed: \OpenDxp\Bundle\NewsletterBundle\Model\DataObject\ClassDefinition\Data\NewsletterConfirmed
    documents:
        type_definitions:
            map:
                newsletter:
                    class: \OpenDxp\Bundle\NewsletterBundle\Model\Document\Newsletter
                    translatable: false
                    valid_table: 'newsletter'
                    translatable_inheritance: false
                    children_supported: false
                    direct_route: true
                    predefined_document_types: true

opendxp_admin:
    documents:
        email_search:
            - 'newsletter'
